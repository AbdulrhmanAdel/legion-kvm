# Builds the packaged `legion` executable on GitHub's runners, so the ~2 GB of
# build downloads (Debian toolchain, kernel, QEMU, Mesa sources) happen here,
# not at home. Start it from the Actions tab or with:
#   gh workflow run build-legion.yml -R AbdulrhmanAdel/legion-kvm
# then download with:
#   gh run download <run-id> -R AbdulrhmanAdel/legion-kvm
name: Build Legion

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Source repository to build
        default: brcly/legion-kvm
      ref:
        description: Branch, tag or commit to build
        default: main
      jobs:
        description: Parallel build jobs (hosted runners have 4 cores)
        default: "4"

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: ${{ inputs.repository }}
  SOURCE_REF: ${{ inputs.ref }}
  BUILD_JOBS: ${{ inputs.jobs }}
  SOURCE_DIR: legion-kvm
  MIN_FREE_GB: 30

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google
          sudo docker image prune --all --force || true
          df -h / /mnt || true

      - name: Pick the build disk
        run: |
          free_root=$(df --output=avail -B1G / | tail -1 | tr -d ' ')
          free_mnt=$(df --output=avail -B1G /mnt 2>/dev/null | tail -1 | tr -d ' ' || echo 0)
          if [ "${free_mnt:-0}" -gt "$free_root" ]; then
            sudo mkdir -p /mnt/legion
            sudo chown "$(id -u):$(id -g)" /mnt/legion
            out=/mnt/legion/build; free=$free_mnt
          else
            out="$RUNNER_TEMP/build"; free=$free_root
          fi
          echo "Build output: $out ($free GB free)"
          if [ "$free" -lt "$MIN_FREE_GB" ]; then
            echo "::warning::Only $free GB free; the project asks for about 25 GB"
          fi
          echo "BUILD_OUT=$out" >> "$GITHUB_ENV"

      - name: Check out the source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: ${{ env.SOURCE_DIR }}
          persist-credentials: false

      - name: Record the source commit
        run: |
          commit=$(git -C "$SOURCE_DIR" rev-parse HEAD)
          git -C "$SOURCE_DIR" log -1 --format='%H %ad %s' --date=iso
          echo "SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT=${commit:0:7}" >> "$GITHUB_ENV"

      - name: Check Podman
        run: |
          command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version

      - name: Build
        run: python3 "$SOURCE_DIR/tools/build.py" --jobs "$BUILD_JOBS" --output "$BUILD_OUT"

      - name: Checksum
        run: |
          cd "$BUILD_OUT/dist"
          ls -la
          sha256sum legion | tee legion.sha256
          {
            echo "repository $SOURCE_REPOSITORY"
            echo "commit     $SOURCE_COMMIT"
            echo "run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "sha256     $(cut -d' ' -f1 legion.sha256)"
            echo "bytes      $(stat -c %s legion)"
          } | tee legion.source.txt
          { echo '```'; cat legion.source.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ./legion --version || true

      - name: Upload legion
        uses: actions/upload-artifact@v7
        with:
          name: legion-${{ env.SOURCE_SHORT }}
          path: |
            ${{ env.BUILD_OUT }}/dist/legion
            ${{ env.BUILD_OUT }}/dist/legion.sha256
            ${{ env.BUILD_OUT }}/dist/legion.source.txt
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ env.SOURCE_SHORT }}
          path: ${{ env.BUILD_OUT }}/**/*.log
          if-no-files-found: ignore
          retention-days: 14
