[package]
rust-version.workspace = true
license.workspace = true
repository.workspace = true
name = "legion-proton-workload"
version.workspace = true
edition.workspace = true
description = "Proton application runtime and rendering utilities"

[features]
gpu-clock-probe = ["dep:ash"]
driver-context-probe = []
syscall-count-probe = []

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
legion-cpu-contract = { path = "../cpu-contract" }
windows = { version = "0.61.1", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Environment", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
anyhow = "1.0"
libc = "0.2"
sha2 = "0.10"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

[[bin]]
name = "legion-proton-workload"
path = "src/main.rs"
test = false

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "legion-proton-bootstrap"
path = "src/bootstrap.rs"

[[bin]]
name = "legion-gpu-clock-probe"
path = "src/clock_probe.rs"
required-features = ["gpu-clock-probe"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
