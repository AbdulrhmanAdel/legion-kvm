[package]
rust-version.workspace = true
license.workspace = true
repository.workspace = true
name = "legion-gpu-presenter"
version.workspace = true
edition.workspace = true
description = "Host DMA-BUF presentation with completion-checked buffer releases"

[dependencies]
anyhow = "1.0"
legion-display-channel = { path = "../display-channel" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
rustix = { version = "1.1", features = ["event", "time", "fs"] }

[dev-dependencies]
rustix = { version = "1.1", features = ["pipe"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
